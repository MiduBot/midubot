# Discord bots must not run two instances at once.
# In Coolify: disable Rolling Updates / Zero Downtime Deployment so the old
# container is stopped before the new one starts (brief downtime, no double replies).
services:
  midubot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HEALTH_PORT:-3000}:${HEALTH_PORT:-3000}"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const p=process.env.HEALTH_PORT||'3000';fetch('http://127.0.0.1:'+p+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 45s
